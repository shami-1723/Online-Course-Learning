<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | LearnSphere</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="auth-page"><a class="brand auth-brand" href="/"><span class="brand-mark">L</span> Learn<span>Sphere</span></a>
<div class="auth-card"><div class="eyebrow">YOUR LEARNING JOURNEY</div><h1>Create your account.</h1><p>Join as a student or instructor.</p>
<form id="registerForm"><label>Full name<input name="name" required maxlength="100" placeholder="Your name"></label><label>Email address<input type="email" name="email" required placeholder="you@example.com"></label><label>Password<input type="password" name="password" required minlength="6" placeholder="At least 6 characters"></label><label>Account type<select name="role"><option value="student">Student</option><option value="instructor">Instructor</option></select></label><button class="btn full" type="submit">Create account <span>→</span></button><div class="form-message" id="formMessage"></div></form>
<div class="auth-bottom">Already registered? <a href="/login.html">Log in</a></div></div><script src="/js/app.js"></script></body></html>
