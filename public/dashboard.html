<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | LearnSphere</title><link rel="stylesheet" href="/css/style.css"></head><body>
<header class="topbar"><a class="brand" href="/"><span class="brand-mark">L</span> Learn<span>Sphere</span></a><nav><a href="/courses.html">Explore courses</a></nav><div class="nav-actions"><button class="btn btn-small" id="logoutBtn">Log out</button></div></header>
<main class="section page-section"><div class="eyebrow">YOUR LEARNING SPACE</div><h1 class="page-title" id="welcomeTitle">Your dashboard</h1><p>Choose a subject and start learning.</p>
<section class="panel subject-panel"><div class="subject-heading"><div><div class="eyebrow">START LEARNING</div><h2>Available subjects</h2></div><span class="subject-count">3 COURSES</span></div><div id="subjectGrid" class="course-grid"><div class="loading">Loading subjects...</div></div></section>
<div class="dashboard-grid"><section class="panel"><h2>Your enrolled courses</h2><div id="myCourses">Loading your courses...</div></section>
<section class="panel" id="instructorPanel" hidden><h2>Create a course</h2><form id="courseForm"><label>Course title<input name="title" required maxlength="100"></label><label>Description<textarea name="description" rows="4"></textarea></label><div class="two-fields"><label>Price (₹)<input name="price" type="number" min="0" step="0.01" value="0"></label><label>Duration (days)<input name="duration" type="number" min="1" value="30"></label></div><button class="btn full" type="submit">Publish course</button><div class="form-message" id="courseMessage"></div></form></section></div>
<section class="panel instructor-lessons" id="lessonPanel" hidden><h2>Add a lesson</h2><form id="lessonForm"><label>Course ID<input name="course_id" type="number" required></label><label>Lesson title<input name="lesson_title" required></label><label>Lesson content<textarea name="content" rows="3"></textarea></label><label>Video URL (optional)<input name="video_url" type="url"></label><label>Sequence number<input name="sequence_no" type="number" value="1"></label><button class="btn" type="submit">Add lesson</button><div class="form-message" id="lessonMessage"></div></form></section>
</main><footer><p>Designed and developed by <strong>M. Shamindra</strong></p></footer><script src="/js/app.js"></script></body></html>
